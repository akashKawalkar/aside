# The nightly brain: pull Calendar/Tasks, sessionize, day record, extract, patterns, digest, plan the day, push Calendar, review.
# It runs while the person sleeps and plans the day that starts at 05:00.
# Everything personal lives in the database and in the repository secrets; this repository holds only code.
name: nightly

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST: the night run (plans the day that starts at 05:00)
    - cron: "30 21 * * *"   # 03:00 IST: the retry (the same day, a no-op if it is already planned)
  workflow_dispatch:
    inputs:
      kind:
        description: "nightly (the 02:00 run), morning_retry (the 03:00 run), manual, or replan (started by the phone)"
        default: nightly
        type: choice
        options: [nightly, morning_retry, manual, replan]

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-action.txt
      - run: pip install -r requirements-action.txt
      - name: Run the nightly job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          AGENT_BACKGROUND_ENABLED: "1"
          AGENT_NIGHTLY_IN_ACTION: "1"
          TZ: UTC
          KIND: ${{ github.event.inputs.kind || (github.event.schedule == '30 21 * * *' && 'morning_retry') || 'nightly' }}
        run: python -m cloud "$KIND"

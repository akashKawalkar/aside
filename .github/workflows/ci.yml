# Tests on Linux against a throwaway Postgres (pgvector) container: the migrations are applied from scratch, then every
# test runs. The database tests refuse any DATABASE_URL that is not local or DATABASE_URL_TEST, so real data is never touched.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aside_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aside_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/aside_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-action.txt
      - name: Install (without torch - the embedder is imported lazily)
        run: |
          grep -v -i sentence-transformers requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r requirements-action.txt httpx
      - name: Migrations from scratch
        run: alembic upgrade head
      - name: Tests (UTC clock, like the Action)
        env:
          TZ: UTC
        run: >
          python -m pytest -q
          --ignore=tests/test_codemap.py --ignore=tests/test_llmmap.py
          --ignore=tests/test_supervisor.py --ignore=tests/test_browser_reader.py
